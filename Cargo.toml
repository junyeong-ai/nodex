[workspace]
members = ["nodex-core", "nodex-cli", "nodex-mcp"]
resolver = "3"

[workspace.package]
version = "0.4.1"
edition = "2024"
rust-version = "1.95"
license = "MIT"
repository = "https://github.com/junyeong-ai/nodex"

[workspace.dependencies]
# Serialization
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
yaml_serde = "0.10.4"
toml = "1.1.2"

# Collections / hashing
indexmap = { version = "2.14.0", features = ["serde"] }
sha2 = "0.11.0"

# Errors
thiserror = "2.0.18"
anyhow = "1.0.102"

# Parsing
pulldown-cmark = "0.13.3"
regex = "1.12.3"
globset = "0.4.18"

# Time
chrono = { version = "0.4.44", default-features = false, features = ["serde", "clock"] }

# Parallelism
rayon = "1.12.0"

# CLI
clap = { version = "4.6.1", features = ["derive"] }

# Test
tempfile = "3.27.0"
assert_cmd = "2.2.1"
criterion = "0.8.2"

[profile.release]
lto = "fat"
codegen-units = 1
strip = true
opt-level = 3
