[workspace]
members = ["nodex-core", "nodex-cli"]
resolver = "3"

[workspace.package]
version = "0.40.0"
edition = "2024"
rust-version = "1.97"
license = "MIT"
repository = "https://github.com/junyeong-ai/nodex"

[workspace.dependencies]
# Serialization
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
yaml_serde = "0.10.7"
toml = "1.1.4"

# Collections / hashing
indexmap = { version = "2.14.0", features = ["serde"] }
sha2 = "0.11.0"

# Errors
thiserror = "2.0.20"
anyhow = "1.0.104"

# Parsing
pulldown-cmark = "0.13.4"
regex = "1.13.1"
globset = "0.4.20"

# Time
chrono = { version = "0.4.45", default-features = false, features = ["serde", "clock"] }

# Parallelism
rayon = "1.12.0"

# CLI
clap = { version = "4.6.6", features = ["derive"] }
semver = "1.0.28"

insta = { version = "1.48.0", features = ["json"] }

# Schema
schemars = { version = "1.2.2", features = ["chrono04"] }

# Test
tempfile = "3.27.0"
assert_cmd = "2.2.2"
criterion = "0.8.2"
jsonschema = "0.50.0"
proptest = "1.11.0"

[profile.release]
lto = "fat"
codegen-units = 1
strip = true
opt-level = 3
