[workspace]
members = ["nodex-core", "nodex-cli"]
resolver = "3"

[workspace.package]
version = "0.33.24"
edition = "2024"
rust-version = "1.97"
license = "MIT"
repository = "https://github.com/junyeong-ai/nodex"

[workspace.dependencies]
# Serialization
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.150"
yaml_serde = "0.10.4"
toml = "1.1.2"

# Collections / hashing
indexmap = { version = "2.14.0", features = ["serde"] }
sha2 = "0.11.0"

# Errors
thiserror = "2.0.18"
anyhow = "1.0.103"

# Parsing
pulldown-cmark = "0.13.4"
regex = "1.13.0"
globset = "0.4.18"

# Time
chrono = { version = "0.4.45", default-features = false, features = ["serde", "clock"] }

# Parallelism
rayon = "1.12.0"

# CLI
clap = { version = "4.6.1", features = ["derive"] }
semver = "1.0.28"

insta = { version = "1.44.5", features = ["json"] }

# Schema
schemars = { version = "1.2", features = ["chrono04"] }

# Test
tempfile = "3.27.0"
assert_cmd = "2.2.2"
criterion = "0.8.2"
jsonschema = "0.47"
proptest = "1.11.0"

[profile.release]
lto = "fat"
codegen-units = 1
strip = true
opt-level = 3
