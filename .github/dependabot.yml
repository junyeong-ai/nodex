version: 2
updates:
  # GitHub Actions referenced by workflow files under .github/workflows/.
  # Dependabot opens PRs on minor / patch updates so tag references stay
  # current; pair with branch protection that requires CI pass before
  # merging, so a rotated action cannot land without green builds.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      actions:
        patterns: ["*"]
    commit-message:
      prefix: "chore(ci)"
      include: scope

  # Cargo workspace dependencies. Grouped so routine compatible updates
  # land in one PR rather than dozens. A release waits out the cooldown
  # before a PR proposes it, so one yanked or compromised within days never
  # lands; security updates ignore the cooldown and still fire immediately.
  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      cargo:
        patterns: ["*"]
        update-types: [minor, patch]
    commit-message:
      prefix: "chore(deps)"
      include: scope
