name: Rust toolchain
description: >-
  Install the toolchain `rust-toolchain.toml` pins, so a job builds with
  what it installed.

inputs:
  targets:
    description: Space-separated target triples to install beside the host's.
    required: false
    default: ""
  components:
    description: Space-separated components to install beside the pinned ones.
    required: false
    default: ""

runs:
  using: composite
  steps:
    - name: Install the pinned toolchain
      shell: bash
      env:
        TARGETS: ${{ inputs.targets }}
        COMPONENTS: ${{ inputs.components }}
      run: |
        # Without a toolchain argument rustup acts on the active one, which
        # `rust-toolchain.toml` names; a cross target added to any other
        # toolchain fails with "can't find crate for `core`". `install` skips
        # an existing toolchain whole, so targets and components are added
        # on their own.
        rustup toolchain install --profile minimal --no-self-update
        if [ -n "$TARGETS" ]; then rustup target add $TARGETS; fi
        if [ -n "$COMPONENTS" ]; then rustup component add $COMPONENTS; fi
        rustc --version
