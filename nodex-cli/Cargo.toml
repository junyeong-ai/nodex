[package]
name = "nodex-cli"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "Universal graph-based document tool — CLI"

[[bin]]
name = "nodex"
path = "src/main.rs"

# Release-CI contract gate: diffs two `nodex export envelope-schema`
# outputs and enforces the CODEGEN.md semver promise. Built and run by
# the release workflow's `contract` job; never packaged into release
# archives.
[[bin]]
name = "contract-gate"
path = "src/bin/contract_gate.rs"

[package.metadata.binstall]
pkg-url = "{ repo }/releases/download/v{ version }/nodex-v{ version }-{ target }.tar.gz"
pkg-fmt = "tgz"
bin-dir = "{ bin }{ binary-ext }"

[package.metadata.binstall.overrides.x86_64-pc-windows-msvc]
pkg-url = "{ repo }/releases/download/v{ version }/nodex-v{ version }-{ target }.zip"
pkg-fmt = "zip"

[package.metadata.binstall.overrides.aarch64-pc-windows-msvc]
pkg-url = "{ repo }/releases/download/v{ version }/nodex-v{ version }-{ target }.zip"
pkg-fmt = "zip"

[dependencies]
nodex-core = { path = "../nodex-core", version = "0.33.18" }
serde = { workspace = true }
serde_json = { workspace = true }
clap = { workspace = true }
anyhow = { workspace = true }
regex = { workspace = true }
chrono = { workspace = true }
semver = { workspace = true }

[dev-dependencies]
assert_cmd = { workspace = true }
insta = { workspace = true }
tempfile = { workspace = true }
jsonschema = { workspace = true }
serde_json = { workspace = true }
